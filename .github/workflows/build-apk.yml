name: Build Android APK

on:
  push:
    branches:
      - foto-perspectiva-apk-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Perspectiva-Foto-3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perspectiva-Foto-3D-APK
          path: dist/Perspectiva-Foto-3D.apk
          if-no-files-found: error
          retention-days: 30
